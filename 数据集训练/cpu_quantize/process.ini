[PROJECT]
name = MNIST CNN Train & Quantize
author = Auto-generated
date = 2026-06-06
description = Train a small CNN on MNIST (16x16 input), quantize weights to 6-bit int, export

[DATA]
source = MNIST/ (local .ubyte files)
train_images = MNIST/train-images-idx3-ubyte/train-images.idx3-ubyte
train_labels = MNIST/train-labels-idx1-ubyte/train-labels.idx1-ubyte
test_images = MNIST/t10k-images-idx3-ubyte/t10k-images.idx3-ubyte
test_labels = MNIST/t10k-labels-idx1-ubyte/t10k-labels.idx1-ubyte
original_size = 28x28
target_size = 16x16
resize_method = bilinear (F.interpolate)
input_pixel_range = 0-63
input_normalization = none (keep raw 0-63, no zero-mean)

[NETWORK]
type = SimpleCNN
input = 16x16x1

[conv1]
in_channels = 1
out_channels = 3
kernel_size = 3
stride = 1
padding = 1
activation = ReLU
pool = MaxPool2d 2x2 stride=2
output_size = 8x8x3

[conv2]
in_channels = 3
out_channels = 8
kernel_size = 3
stride = 1
padding = 1
activation = ReLU
pool = MaxPool2d 2x2 stride=2
output_size = 4x4x8

[flatten]
dim = 128

[fc1]
in_features = 128
out_features = 36
activation = ReLU

[fc2]
in_features = 36
out_features = 10
activation = none (CrossEntropyLoss has built-in softmax)

[PARAM_COUNT]
conv1 = 30 (27 weight + 3 bias)
conv2 = 224 (216 weight + 8 bias)
fc1 = 4644 (4608 weight + 36 bias)
fc2 = 370 (360 weight + 10 bias)
total = 5268

[TRAINING]
loss = CrossEntropyLoss
optimizer = Adam
learning_rate = 0.001
batch_size = 64
epochs = 20
train_set_size = 60000
test_set_size = 10000

[QUANTIZATION]
target_bit_width = 6
target_range = -32 to 31
scale_method = global max_abs
scale_formula = 31.0 / max(abs(all_weights))
rounding = round-to-nearest
clamp = [-32, 31]
bias_quantized_with_same_scale = yes
quantize_error = -0.0060 (97.35% -> 96.75%)

[EXPORTED_WEIGHTS]
folder = exported_weights/
format = plain text, one integer per line, row-major order
files = conv1_weight.txt, conv1_bias.txt, conv2_weight.txt, conv2_bias.txt,
        fc1_weight.txt, fc1_bias.txt, fc2_weight.txt, fc2_bias.txt
total_values = 5268

[EXPORTED_SHAPES]
conv1_weight = [3, 1, 3, 3]
